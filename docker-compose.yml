services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movieverse
      POSTGRES_USER: movieverse
      POSTGRES_PASSWORD: movieverse_dev
    ports:
      - "5432:5432"
    volumes:
      - movieverse_data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieverse -d movieverse"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    environment:
      PORT: 4000
      DATABASE_URL: postgres://movieverse:movieverse_dev@db:5432/movieverse
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  movieverse_data:
