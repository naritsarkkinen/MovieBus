
name: Deploy MovieBus Frontend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - '.github/workflows/azure-static-web-apps-green-beach-0a12a4503.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build frontend
        working-directory: Frontend
        env:
          VITE_API_URL: moviebus-api-bdddc9aqcwfjf4dt.swedencentral-01.azurewebsites.net/api
        run: npm run build

      - name: Deploy frontend to Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: Frontend/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
