
name: Sync TMDB Movies to Azure PostgreSQL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: moviebus-tmdb-sync
  cancel-in-progress: false

jobs:
  sync-tmdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install database dependencies
        working-directory: database
        run: npm ci

      - name: Import TMDB movies into PostgreSQL
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          MOVIEBUS_DB_PASSWORD: ${{ secrets.MOVIEBUS_DB_PASSWORD }}

        run: |
          for attempt in 1 2 3; do
            echo "Starting TMDB import (attempt $attempt/3)"

            if node database/import-tmdb.cjs; then
              echo "TMDB import completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Import failed. Retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "TMDB import failed after 3 attempts."
          exit 1
