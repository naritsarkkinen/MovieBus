
name: Deploy MovieBus Backend

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/main_moviebus-api.yml"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci --omit=dev

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Backend/
          include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8701FE5742454597AB8AE76B3ADA3FC6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3338FFE6543149C5B6396A98ACA933DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3374EBC68818473BB603A1B4C4E9FFD7 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: moviebus-api
          slot-name: Production
          package: .
