name: Build and deploy MovieBus Backend

on:
  push:
    branches:
      
main
  paths:
'Backend/**'
'.github/workflows/deploy-backend.yml'
workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      
uses: actions/checkout@v4

      
name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'

      
name: Install backend dependencies
      working-directory: Backend
      run: npm ci --omit=dev

      
name: Upload Backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: Backend/
        include-hidden-files: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      
name: Download Backend artifact
      uses: actions/download-artifact@v4
      with:
        name: node-app
        path: .

      
name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_941B6F8C81644DC69D4891D76F7F0F7A }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_35B89AD1615C4D59B2027CC8966E94EE }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6BA58FA76C5645A987E59AB0F95C40E0 }}

      
name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: moviebus-api
        slot-name: Production
        package: .
